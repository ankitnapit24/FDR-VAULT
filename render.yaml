# Render Blueprint specification for FDR Vault (AICTE Problem Statement 26265)
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  # 1. FDR Vault Backend API Web Service
  - type: web
    name: fdrvault-backend-api
    runtime: node
    plan: starter
    region: singapore # or oregon / frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: e.g. mongodb+srv://<user>:<password>@cluster0.mongodb.net/fdrflow?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically random 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set to your frontend URL: e.g. https://fdrvault.vercel.app
      - key: AUTO_SEED
        value: "false" # Set to "true" only on initial deployment to seed demo accounts if desired
      - key: STORAGE_DRIVER
        value: local # Change to "s3" if using AWS S3 / Cloudflare R2 / MinIO
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # 2. FDR Vault Frontend Portal (Static Site with SPA Routing)
  - type: web
    name: fdrvault-portal
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fdrvault-backend-api
          property: host
        transform: https://{host}/api
