version: '3.8'

services:
  # 1. Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fdrflow_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-ap-south-1}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - AUTO_SEED=${AUTO_SEED:-false}
    volumes:
      - fdr_uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 2. Frontend Nginx Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: fdrflow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  fdr_uploads:
    driver: local
